<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virtual Kiyib Ko'rish</title>
<style>
  :root {
    --bg: #f5f3ef; --card: #ffffff; --text: #1d1b18; --muted: #6f6a62;
    --line: #e2ddd4; --accent: #2f5d50; --accent-text: #ffffff;
    --ok: #2f7d4f; --warn: #b7791f; --err: #b3261e; --drop: #faf8f4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161513; --card: #201f1c; --text: #ece8e1; --muted: #a39d93;
      --line: #36332e; --accent: #7fb8a4; --accent-text: #10201b;
      --ok: #6fcf97; --warn: #f2c94c; --err: #ff8a80; --drop: #1b1a18;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  .status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.err { background: var(--err); }

  .grid { display: grid; grid-template-columns: 1fr 1fr 1.15fr; gap: 16px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr 1fr; } .result-card { grid-column: 1 / -1; } }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .card h2 { font-size: 14px; font-weight: 600; margin: 0; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }

  .drop {
    position: relative; aspect-ratio: 2 / 3; border: 2px dashed var(--line); border-radius: 10px;
    background: var(--drop); display: grid; place-items: center; text-align: center;
    color: var(--muted); cursor: pointer; overflow: hidden; transition: border-color .15s;
  }
  .drop:hover, .drop.over { border-color: var(--accent); }
  .drop img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: var(--drop); }
  .drop input { display: none; }
  .drop .hint { padding: 16px; font-size: 14px; }
  .drop .hint b { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }

  label.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  select, input[type=number], input[type=text] {
    font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; width: 100%;
  }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  div.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
  .checks { display: grid; grid-template-columns: 1fr; gap: 4px; }
  .checks label { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 14px; cursor: pointer; }
  .checks input { width: 16px; height: 16px; accent-color: var(--accent); }

  .result-box {
    aspect-ratio: 2 / 3; border-radius: 10px; background: var(--drop); border: 1px solid var(--line);
    display: grid; place-items: center; overflow: hidden; color: var(--muted); text-align: center; position: relative;
  }
  .result-box img { width: 100%; height: 100%; object-fit: contain; }
  .thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
  .thumbs img { width: 56px; height: 84px; object-fit: cover; border-radius: 6px; border: 2px solid transparent; cursor: pointer; }
  .thumbs img.active { border-color: var(--accent); }

  .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 16px; }
  button.primary {
    font: inherit; font-weight: 600; background: var(--accent); color: var(--accent-text);
    border: 0; border-radius: 10px; padding: 12px 22px; cursor: pointer; min-width: 180px;
  }
  button.primary:disabled { opacity: .5; cursor: not-allowed; }
  a.download { color: var(--accent); font-weight: 600; text-decoration: none; display: none; }
  .msg { font-size: 14px; color: var(--muted); }
  .msg.err { color: var(--err); }

  .spinner { width: 36px; height: 36px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite; margin: 0 auto 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Model yuklanish paneli */
  .setup { margin-bottom: 16px; display: none; }
  .setup.show { display: flex; }
  .setup-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .setup-big { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .setup-meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar { height: 10px; background: var(--drop); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .8s ease; }
  .bar.small { height: 6px; }
  .files { display: flex; flex-direction: column; gap: 10px; }
  .file-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 13px; }
  .file-row .bar { grid-column: 1 / -1; }
  .file-row .st { color: var(--muted); font-variant-numeric: tabular-nums; }
  .file-row.done .st { color: var(--ok); }
  .file-row.downloading .st, .file-row.merging .st { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Virtual kiyib ko'rish — test</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">Server tekshirilmoqda…</span></div>
  </header>

  <!-- 0. Model yuklanish holati (yuklash tugagach yashiriladi) -->
  <div class="card setup" id="setup">
    <h2>Model yuklanmoqda</h2>
    <div class="setup-head">
      <span class="setup-big" id="setupPct">0%</span>
      <span class="setup-meta" id="setupMeta">—</span>
    </div>
    <div class="bar"><div id="setupBar"></div></div>
    <div class="files" id="setupFiles"></div>
  </div>

  <div class="grid">
    <!-- 1. Odam rasmi -->
    <div class="card">
      <h2>1. Odam rasmi</h2>
      <label class="drop" id="personDrop">
        <input type="file" id="personInput" accept="image/jpeg,image/png,image/webp">
        <div class="hint"><b>Rasm tanlang</b>yoki shu yerga tashlang<br>JPG / PNG / WEBP</div>
      </label>
    </div>

    <!-- 2. Kiyim rasmi + sozlamalar -->
    <div class="card">
      <h2>2. Kiyim rasmi</h2>
      <label class="drop" id="garmentDrop">
        <input type="file" id="garmentInput" accept="image/jpeg,image/png,image/webp">
        <div class="hint"><b>Rasm tanlang</b>yoki shu yerga tashlang<br>JPG / PNG / WEBP</div>
      </label>
      <div class="field">Rasmda nimalar bor? (faqat belgilanganlar kiydiriladi)
        <div class="checks" id="items">
          <label><input type="checkbox" value="auto" checked> <b>Avto: rasmdagi hamma narsa</b></label>
          <label><input type="checkbox" value="top"> Ustki kiyim (ko'ylak, futbolka, polo)</label>
          <label><input type="checkbox" value="bottom"> Pastki kiyim (shim, yubka, shorti)</label>
          <label><input type="checkbox" value="dress"> Libos / kombinezon</label>
          <label><input type="checkbox" value="outer"> Ustki qavat (kurtka, pidjak, palto)</label>
          <label><input type="checkbox" value="shoes"> Oyoq kiyim</label>
          <label><input type="checkbox" value="headwear"> Bosh kiyim (kepka, shlyapa)</label>
          <label><input type="checkbox" value="eyewear"> Ko'zoynak</label>
          <label><input type="checkbox" value="watch"> Soat</label>
          <label><input type="checkbox" value="bag"> Sumka</label>
        </div>
      </div>
      <div class="row">
        <label class="field">Sifat
          <select id="steps">
            <option value="4" selected>Tez (4 qadam)</option>
            <option value="8">Yaxshiroq (8 qadam)</option>
          </select>
        </label>
        <label class="field">Variantlar
          <select id="samples">
            <option value="1" selected>1</option>
            <option value="2">2</option>
            <option value="3">3</option>
          </select>
        </label>
      </div>
      <label class="field">Qo'shimcha ko'rsatma (ixtiyoriy, inglizcha yaxshiroq)
        <input type="text" id="extraPrompt" placeholder="masalan: tuck the shirt into the pants">
      </label>
      <label class="field">Seed (bir xil seed = bir xil natija)
        <input type="number" id="seed" value="42" min="0">
      </label>
    </div>

    <!-- 3. Natija -->
    <div class="card result-card">
      <h2>3. Natija</h2>
      <div class="result-box" id="resultBox">Natija shu yerda chiqadi</div>
      <div class="thumbs" id="thumbs"></div>
    </div>
  </div>

  <div class="actions">
    <button class="primary" id="runBtn" disabled>Kiyintirish</button>
    <a class="download" id="downloadLink" download="natija.png">Natijani yuklab olish</a>
    <span class="msg" id="msg"></span>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const files = { person: null, garment: null };
  let serverReady = false;

  // ---------- Rasm tanlash + drag & drop ----------
  function setupDrop(dropId, inputId, key) {
    const drop = $(dropId), input = $(inputId);
    const show = (file) => {
      if (!file || !file.type.startsWith("image/")) return;
      files[key] = file;
      let img = drop.querySelector("img");
      if (!img) { img = document.createElement("img"); drop.appendChild(img); }
      img.src = URL.createObjectURL(file);
      updateButton();
    };
    input.addEventListener("change", () => show(input.files[0]));
    drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("over"));
    drop.addEventListener("drop", (e) => {
      e.preventDefault(); drop.classList.remove("over");
      show(e.dataTransfer.files[0]);
    });
  }
  setupDrop("personDrop", "personInput", "person");
  // libos tanlansa, ustki/pastki kiyim bilan bir vaqtda bo'lmaydi
  const itemBoxes = () => [...document.querySelectorAll("#items input")];
  const selectedItems = () => itemBoxes().filter((b) => b.checked).map((b) => b.value);
  itemBoxes().forEach((b) => b.addEventListener("change", () => {
    if (b.checked && b.value === "auto") itemBoxes().forEach((o) => { if (o !== b) o.checked = false; });
    if (b.checked && b.value !== "auto") itemBoxes().forEach((o) => { if (o.value === "auto") o.checked = false; });
    if (b.checked && b.value === "dress") itemBoxes().forEach((o) => { if (o.value === "top" || o.value === "bottom") o.checked = false; });
    if (b.checked && (b.value === "top" || b.value === "bottom")) itemBoxes().forEach((o) => { if (o.value === "dress") o.checked = false; });
    updateButton();
  }));
  setupDrop("garmentDrop", "garmentInput", "garment");

  function updateButton() {
    $("runBtn").disabled = !(serverReady && setupComplete && files.person && files.garment
                             && document.querySelector("#items input:checked"));
  }

  // ---------- Model yuklanish holati (real vaqt) ----------
  let setupComplete = true;
  const samples = [];  // [vaqt, baytlar] — tezlikni hisoblash uchun
  const GB = (b) => (b / 1e9).toFixed(2) + " GB";
  const fmtTime = (s) => {
    if (!isFinite(s) || s < 0) return "—";
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = Math.floor(s % 60);
    return h ? `${h} soat ${m} daq` : m ? `${m} daq ${sec} s` : `${sec} s`;
  };
  const STATE = { done: "✓ tayyor", downloading: "yuklanmoqda", merging: "birlashtirilmoqda", pending: "navbatda" };

  async function checkSetup() {
    let s;
    try { s = await (await fetch("/api/setup")).json(); } catch { return; }
    setupComplete = s.complete;
    $("setup").classList.toggle("show", !s.complete);
    updateButton();
    if (s.complete) return;

    samples.push([s.time, s.done]);
    while (samples.length > 2 && s.time - samples[0][0] > 30) samples.shift();
    const [t0, d0] = samples[0];
    const speed = s.time > t0 ? (s.done - d0) / (s.time - t0) : 0;

    const pct = (100 * s.done / s.total);
    $("setupPct").textContent = pct.toFixed(1) + "%";
    $("setupBar").style.width = pct + "%";
    $("setupMeta").textContent =
      `${GB(s.done)} / ${GB(s.total)} · ${(speed / 1e6).toFixed(1)} MB/s · qoldi: ${fmtTime((s.total - s.done) / speed)}`;

    $("setupFiles").innerHTML = s.files.map((f) => {
      const p = 100 * f.done / f.size;
      const st = f.state === "downloading" ? `${GB(f.done)} / ${GB(f.size)} (${p.toFixed(0)}%)` : STATE[f.state] + ` · ${GB(f.size)}`;
      return `<div class="file-row ${f.state}"><span>${f.name}</span><span class="st">${st}</span>
              <div class="bar small"><div style="width:${p}%"></div></div></div>`;
    }).join("");
  }
  checkSetup();
  setInterval(checkSetup, 2000);

  // ---------- Server holati ----------
  async function checkHealth() {
    try {
      const r = await fetch("/api/health");
      const h = await r.json();
      serverReady = h.ready;
      $("dot").className = "dot " + (h.ready ? (h.busy ? "warn" : "ok") : "err");
      let t = h.ready ? `Tayyor · ${h.device}` : "Model yuklanmagan";
      if (h.busy) t += ` · band (navbatda: ${h.waiting})`;
      $("statusText").textContent = t;
    } catch {
      serverReady = false;
      $("dot").className = "dot err";
      $("statusText").textContent = "Serverga ulanib bo'lmadi";
    }
    updateButton();
  }
  checkHealth();
  setInterval(checkHealth, 5000);

  // ---------- Natijani ko'rsatish ----------
  function showResult(src) {
    $("resultBox").innerHTML = "";
    const img = document.createElement("img");
    img.src = src;
    $("resultBox").appendChild(img);
    const link = $("downloadLink");
    link.href = src;
    link.style.display = "inline";
    document.querySelectorAll("#thumbs img").forEach((t) => t.classList.toggle("active", t.src === src));
  }

  // ---------- Yuborish ----------
  $("runBtn").addEventListener("click", async () => {
    const fd = new FormData();
    fd.append("person", files.person);
    fd.append("garment", files.garment);
    fd.append("items", selectedItems().join(","));
    fd.append("num_timesteps", $("steps").value);
    fd.append("num_samples", $("samples").value);
    fd.append("seed", $("seed").value || "42");
    fd.append("extra_prompt", $("extraPrompt").value);

    $("runBtn").disabled = true;
    $("msg").className = "msg";
    $("thumbs").innerHTML = "";
    $("downloadLink").style.display = "none";
    const started = Date.now();
    $("resultBox").innerHTML = '<div><div class="spinner"></div><span id="timer">0 s</span></div>';
    const timer = setInterval(() => {
      const el = $("timer");
      if (el) el.textContent = Math.round((Date.now() - started) / 1000) + " s";
    }, 500);
    $("msg").textContent = "Ishlanmoqda…";

    try {
      // Server VTON_API_KEY bilan himoyalangan bo'lsa, kalit bir marta so'raladi va brauzerda saqlanadi
      const send = () => {
        let key = "";
        try { key = localStorage.getItem("vtonApiKey") || ""; } catch {}
        return fetch("/api/tryon", { method: "POST", body: fd, headers: key ? { "X-Api-Key": key } : {} });
      };
      let r = await send();
      if (r.status === 401) {
        const key = prompt("API kalitini kiriting (VTON_API_KEY):");
        if (key) {
          try { localStorage.setItem("vtonApiKey", key.trim()); } catch {}
          r = await send();
        }
      }
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.detail || `Xato: HTTP ${r.status}`);

      const srcs = data.images.map((b64) => "data:image/png;base64," + b64);
      if (srcs.length > 1) {
        srcs.forEach((src) => {
          const t = document.createElement("img");
          t.src = src;
          t.addEventListener("click", () => showResult(src));
          $("thumbs").appendChild(t);
        });
      }
      showResult(srcs[0]);
      $("msg").textContent = `Tayyor: serverda ${data.seconds} s, jami ${((Date.now() - started) / 1000).toFixed(1)} s`;
    } catch (e) {
      $("resultBox").textContent = "Natija yo'q";
      $("msg").className = "msg err";
      $("msg").textContent = e.message;
    } finally {
      clearInterval(timer);
      updateButton();
    }
  });
</script>
</body>
</html>
